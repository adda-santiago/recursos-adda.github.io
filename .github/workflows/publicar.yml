name: Publicar

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.zip'          # los ZIP los procesa desempaquetar.yml, que luego lanza este flujo
  workflow_dispatch:      # permite lanzarlo a mano y desde desempaquetar.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://adda-santiago.github.io
  BASE_PATH: /recursos-biblicos/

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build          # Astro + índice de Pagefind en dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
