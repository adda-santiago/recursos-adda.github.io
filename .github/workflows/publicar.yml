name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  hostinger:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://adda-santiago.github.io
      BASE_PATH: /recursos-biblicos/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci

      - run: npm run build

      - name: Publicar en Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 45.152.44.89
          port: 21
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          security: loose      # conexión por IP: el certificado no coincide con el host
          local-dir: ./dist/
          server-dir: ./
