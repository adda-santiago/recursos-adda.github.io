# Descomprime cualquier .zip subido a la raíz del repositorio, lo borra,
# confirma los archivos con su estructura de carpetas y lanza la publicación.
name: Desempaquetar ZIP

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  desempaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No hay ZIP en la raíz"; exit 0; fi
          for f in "${zips[@]}"; do
            echo "Descomprimiendo: $f"
            unzip -o "$f" -x '.github/*' '__MACOSX/*'
            rm -f "$f"
          done

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Desempaquetar ZIP"
          git push

      - name: Lanzar publicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --ref main