# Descomprime cualquier .zip subido a la raíz del repositorio, lo borra,
# confirma los archivos con su estructura de carpetas y lanza la publicación.
name: Desempaquetar ZIP

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Si se suben dos ZIP seguidos, la segunda ejecución espera a que termine la primera
concurrency:
  group: desempaquetar
  cancel-in-progress: false

jobs:
  desempaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Descomprimir
        run: |
          git pull --rebase origin main
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No hay ZIP en la raíz"; exit 0; fi
          for f in "${zips[@]}"; do
            echo "Descomprimiendo: $f"
            unzip -o "$f" -x '.github/*' '__MACOSX/*'
            rm -f "$f"
          done

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Desempaquetar ZIP"
          # Si entró otro commit mientras se descomprimía, se integra antes de subir (hasta 3 intentos)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Lanzar publicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --ref main